## 1. 참조 블록 규약

모든 문서는 **H1 제목 바로 아래**에 이 블록을 갖는다. 예외 없다.

```markdown
# 문서 제목

> **근거** — 이 문서가 따르는 상류 (문서 또는 **코드 경로**)
> **이 문서가 바뀌면** — 함께 봐야 할 하류 문서들
> 전체 관계: [문서 지도](상대경로/README.md)
```

- 하류가 없으면 **`함께 볼 하위 문서는 없다 (말단)`** 이라고 적는다. 빈칸으로 두지 않는다 — 읽는 사람이 없는 것을 찾게 된다
- 상류가 코드면 **파일 경로를 적는다.** 문서끼리만 이으면 절반이 빈다. 실제로 가장 자주 바뀌는 상류는 코드다
- 코드가 상류인 문서에는 **역방향도 한 줄 적는다** — 예: `**`LevelData` 가 바뀌면 이 문서를 고쳐야 한다 — 스키마가 여기 그대로 실려 있다`

