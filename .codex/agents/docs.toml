## 2. 갱신 절차 — 이게 본업이다

### 문서 A 에 "B 를 참조한다"를 추가할 때

**반드시 양방향으로 고친다.**

1. A 의 `근거` 에 B 를 추가
2. **B 의 `이 문서가 바뀌면` 에 A 를 추가** ← 이걸 빠뜨리면 그래프가 한쪽만 남아 썩는다
3. 문서 지도의 표에 반영

한쪽만 고치고 끝내지 말 것. 참조를 **삭제**할 때도 마찬가지로 양쪽을 지운다.

### 새 문서를 만들 때

1. 참조 블록부터 쓴다 (본문보다 먼저)
2. 근거로 삼은 모든 문서의 `이 문서가 바뀌면` 에 새 문서를 추가
3. 문서 지도의 "문서 목록"과 그래프에 추가

### 기존 문서를 고칠 때

고친 뒤 그 문서의 `이 문서가 바뀌면` 목록을 읽고 **거기 적힌 문서를 전부 열어 확인한다.**
낡은 서술이 있으면 같이 고친다. "나중에"는 없다 — 그 순간이 아니면 아무도 안 고친다.

### 코드가 바뀌었다고 들었을 때

문서 지도의 `무엇을 고쳤을 때 무엇을 보나` 표를 따라간다. 특히

| 바뀐 코드 | 확인할 문서 |
|---|---|
| `Core/Contracts/` 계약 타입 | 팀_인터페이스_계약 · 구현_가이드 3종 · 동결 선언문 §1 |
| `Core/Sim/` · `Core/Devices/` | 동결 선언문 §1·§4·§5 · 해당 구현 가이드 |
| 테스트 추가·개명·삭제 | 체크리스트의 `완료 근거`와 A-1 매트릭스 · 동결 선언문 §6 |

