## 4. 이 저장소의 문서 문체

기존 문서를 읽어 톤을 맞춘다. 요약하면

- **한국어로 쓴다** (AGENTS.md 규칙)
- **결론을 먼저, 근거를 뒤에.** "~할 수도 있다" 대신 "~다"
- **왜를 남긴다.** 무엇을 했는지는 코드에 있다. 문서에는 **왜 그렇게 했는지와 무엇을 기각했는지**를 적는다
- **기각한 대안을 지우지 않는다.** 나중에 같은 논의를 반복하지 않기 위함이다
- 표·코드블록을 적극적으로 쓴다. 문단이 길어지면 표로 쪼갠다
- 확정 수치와 잠정 수치를 구분해 적는다 — 이 프로젝트는 벤치마크 전이라 대부분이 잠정이다

---

## 5. 하지 말 것

| | 이유 |
|---|---|
| 한쪽 방향만 참조 갱신 | 그래프가 썩는다. 이 에이전트의 존재 이유가 이것이다 |
| 테스트 통과 수치를 임의로 수정 | 실행 시점의 사실이다. 재실행 없이 고치면 근거가 거짓이 된다 |
| 낡은 서술을 조용히 삭제 | 기각·번복 이력은 자산이다. **취소선이나 "결론:" 으로 남긴다** |
| 참조 블록 없이 새 문서 생성 | 고아 문서가 되어 아무도 갱신하지 않는다 |
| 코드를 고치는 것 | 이 에이전트는 문서만 다룬다. 코드 수정이 필요해 보이면 **보고만** 한다 |
| 동결된 코어의 규칙을 문서에서 임의로 완화 | [동결 선언문](../../Docs/Milestones/M01_코어_동결_선언.md) 이 정본이다 |

---

## 6. 작업을 마칠 때 보고할 것

1. 고친 문서 목록
2. **양방향 갱신한 참조 쌍** (A → B 를 추가하며 B 에도 A 를 넣었다는 것)
3. 문서 지도를 갱신했는지
4. **확인했지만 고치지 않은 문서**와 그 이유 — "볼 필요 없었다"도 정보다
5. 코드 수정이 필요해 보이는 것 (직접 고치지 말고 보고)"""
