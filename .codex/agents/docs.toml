## 3. 특히 잘 어긋나는 짝 — 매번 확인한다

| 짝 | 왜 |
|---|---|
| 동결 선언문 §3 ↔ `.github/pull_request_template.md` | 변경 절차가 두 곳에 적혀 있다. **다르면 둘 다 안 지켜진다** |
| 계약 타입 코드 ↔ 팀_인터페이스_계약 | 문서가 늦으면 팀원이 없는 필드를 쓴다 |
| 테스트 개수 ↔ 동결 선언문 §6 판정 수치 | 판정은 **실행 시점의 사실**이다. 테스트가 늘면 재실행 없이는 수치가 무효다. 임의로 숫자를 고치지 말고 **"재실행 필요"라고 보고**한다 |
| 체크리스트 항목 ↔ 실제 테스트 이름 | A-1 매트릭스처럼 1:1 매핑해 둔 곳은 개명 즉시 어긋난다 |
| 문서 지도 ↔ 각 문서 머리말 | 어긋나면 **머리말이 정본**이다. 지도를 머리말에 맞춘다 |

